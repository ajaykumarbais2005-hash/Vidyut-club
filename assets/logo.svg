<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Vidyut Club logo</title>
  <desc id="desc">A stylized lightning bolt inside a rounded hexagonal frame.</desc>
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M60 8 103 33v54L60 112 17 87V33Z" fill="#101729" stroke="url(#boltGrad)" stroke-width="4"/>
  <path d="M66 20 36 62h20l-6 38 34-46H62z" fill="url(#boltGrad)" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(0,229,255,0.18)" stroke-width="2"/>
</svg>
